<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon Master Helper</title>
  </head>
  <body>
    <header>
      <h1>Dungeon Master Helper</h1>
    </header>
    <main>
      <section class="panel dropZone" data-panel="initiative">
        <header class="panel-header">
          <h2>Initiative</h2>
          <button class="clear-init">Clear</button>
          <button class="toggle-size">Expand</button>
        </header>
        <div class="panel-content"></div>
      </section>
      <section class="panel" data-panel="characters">
        <header class="panel-header">
          <h2>Characters</h2>
          <button class="toggle-size">Expand</button>
        </header>
        <div class="panel-content"></div>
      </section>
      <section class="panel" data-panel="monsters">
        <header class="panel-header">
          <h2>Monsters</h2>
          <button class="toggle-size">Expand</button>
        </header>
        <div class="panel-content"></div>
      </section>
      <section class="panel" data-panel="story">
        <header class="panel-header">
          <h2>Story</h2>
          <button class="toggle-size">Expand</button>
        </header>
        <div class="panel-content"></div>
      </section>
      <section class="panel" data-panel="rules">
        <header class="panel-header">
          <h2>Rules</h2>
          <button class="toggle-size">Expand</button>
        </header>
        <div class="panel-content"></div>
      </section>
      <section class="panel" data-panel="randomizers">
        <header class="panel-header">
          <h2>Randomizers</h2>
          <button class="toggle-size">Expand</button>
        </header>
        <div class="panel-content"></div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
